# Portainer-Stack für die Emi-Website.
#
# Diese Datei ist für die PORTAINER "Repository"-Methode gedacht:
# Portainer klont das Repo und BAUT das Image lokal aus dem Dockerfile.
#   → kein Registry-Login, kein "Paket public machen".
#   → Update: am Stack "Pull and redeploy" (klont neu + baut neu).
#   → `pull_policy: build` erzwingt das Neubauen beim Redeploy.
#
# Alternative (Registry-Methode): statt des build-Blocks einfach
#   image: ghcr.io/xepter1/emis_website_3:latest
# eintragen (dafür muss das GHCR-Paket public sein). Siehe README.

services:
  emis-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: emis-website:latest
    container_name: emis-website
    restart: unless-stopped
    pull_policy: build
    ports:
      # Host-Port:Container-Port — linken Wert auf einen freien Port setzen
      # (oder weglassen und per Reverse-Proxy / Labels einbinden).
      - "8087:80"
