# Stack für Emis Website – DREI kleine Dienste:
#
#   web    → Astro-SSR-Frontend (Design unverändert). Holt Inhalte live aus dem CMS.
#   cms    → Payload-CMS (Login unter /admin, Inhalte-DB, Bild-Uploads).
#   proxy  → winziger interner Caddy. Lauscht auf :80 und teilt die Domain auf:
#              /admin* und /api/*  → cms     alles andere → web
#            Nach außen ist der Stack damit „ein Upstream auf Port 80" – passt 1:1
#            zu einem Multi-Tenant-Caddy (caddy.reverse_proxy "{{upstreams 80}}").
#
# Upstream-Aliase: web/cms tragen im internen Netz die EINDEUTIGEN Aliase
# astro/payload. Der Proxy spricht NUR diese an (siehe proxy/Caddyfile) – so
# gibt es im geteilten Caddy-Netz keine Namens-Kollision mit anderen Mandanten.
#
# WICHTIG: Die Volumes cms_data + cms_media MÜSSEN persistent bleiben (Emis
# Projekte + Bilder). Sonst sind nach einem Update alle Inhalte weg.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: emis-website:latest
    container_name: emis-web
    restart: unless-stopped
    pull_policy: build
    depends_on:
      - cms
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      CMS_INTERNAL_URL: http://payload:3001
      CMS_PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL muss gesetzt sein, z. B. https://designbyems.de}
    networks:
      internal:
        aliases: [astro]

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    image: emis-cms:latest
    container_name: emis-cms
    restart: unless-stopped
    pull_policy: build
    environment:
      NODE_ENV: production
      PORT: 3001
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET muss gesetzt sein}
      DATABASE_URI: file:/app/data/emi.db
      MEDIA_DIR: /app/media
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL muss gesetzt sein, z. B. https://designbyems.de}
    volumes:
      - cms_data:/app/data # SQLite-Datenbank (Emis Projekte) – bleibt erhalten
      - cms_media:/app/media # hochgeladene Bilder – bleibt erhalten
    networks:
      internal:
        aliases: [payload]

  form:
    build:
      context: ./contact-server
      dockerfile: Dockerfile
    image: emis-contact:latest
    container_name: emis-contact
    restart: unless-stopped
    pull_policy: build
    # SMTP-Werte in der Server-.env setzen (NIE ins Git). Defaults mit :- (NICHT
    # :?) → der Stack fährt IMMER hoch, auch wenn SMTP noch nicht gesetzt ist;
    # dann gibt der Dienst nur sauber 502 zurück, die Seite bleibt online.
    # WICHTIG: SMTP_PORT=587 (STARTTLS). Hetzner blockiert ausgehend Port 465.
    environment:
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_TO: "${MAIL_TO:-}"
    networks:
      internal:
        aliases: [kontakt]

  proxy:
    # Caddyfile ist ins Image eingebacken (proxy/Dockerfile) – KEIN Bind-Mount,
    # damit lokal dasselbe Image-Muster wie in Produktion gilt (siehe Dockerfile).
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: emis-proxy:latest
    container_name: emis-proxy
    restart: unless-stopped
    pull_policy: build
    depends_on:
      - web
      - cms
      - form
    networks:
      - internal
    # Lokal testen: Host-Port freigeben (hinter dem Multi-Tenant-Caddy weglassen).
    ports:
      - "8087:80"
    # ── Server / Multi-Tenant-Caddy: stattdessen die Labels + das externe Netz
    #    HIER aktivieren und den ports-Block oben entfernen ──
    # labels:
    #   caddy: designbyems.de, www.designbyems.de
    #   caddy.reverse_proxy: "{{upstreams 80}}"
    # networks:
    #   internal:
    #   caddy:

networks:
  internal:
  # caddy:           # Server: externes Multi-Tenant-Netz
  #   external: true

volumes:
  cms_data:
  cms_media:
