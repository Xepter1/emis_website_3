server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kompression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2
        application/xml;

    # Gehashte, unveränderliche Build-Assets dürfen lange gecacht werden
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Seiten: Astro nutzt das „directory"-Format → /pfad/ liefert /pfad/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # Eigene 404-Seite (im Rahmen-Look)
    error_page 404 /404.html;
}
